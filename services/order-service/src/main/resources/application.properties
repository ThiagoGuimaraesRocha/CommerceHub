quarkus.application.name=order-service
quarkus.application.version=0.8.0

quarkus.http.port=8080
%dev.quarkus.http.port=8083
quarkus.http.test-port=0

# Local infrastructure is started explicitly through the root docker-compose.yml.
# Tests start a throwaway Oracle container through Dev Services instead.
quarkus.devservices.enabled=false
%test.quarkus.devservices.enabled=true

quarkus.datasource.db-kind=oracle
quarkus.datasource.devservices.enabled=false
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=gvenzl/oracle-free:23.26.3-slim-faststart@sha256:f5ff19033860d662c821cb04eb10483fa94f14f78eae252d054291ea07028093
%dev,prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
%dev,prod.quarkus.datasource.username=${ORDER_DB_USERNAME:order_schema}
%dev,prod.quarkus.datasource.password=${ORDER_DB_PASSWORD}
quarkus.datasource.jdbc.max-size=10

# Schema is owned by Flyway; Hibernate never changes it.
quarkus.flyway.migrate-at-start=${FLYWAY_MIGRATE_AT_START:true}
# OpenShift migrate Job sets COMMERCEHUB_MIGRATE_ONLY=true so the process exits after Flyway.
commercehub.migrate-only=${COMMERCEHUB_MIGRATE_ONLY:false}
quarkus.flyway.locations=db/migration
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.jdbc.timezone=UTC
quarkus.hibernate-orm.mapping.timezone.default-storage=native
quarkus.hibernate-orm.jdbc.statement-fetch-size=100
%dev.quarkus.hibernate-orm.log.sql=false

# Product Service REST client (ADR 0008).
quarkus.rest-client.product-service.url=${PRODUCT_SERVICE_URL:http://localhost:8082}
quarkus.rest-client.product-service.connect-timeout=2000
quarkus.rest-client.product-service.read-timeout=2000

# API tests mock ProductClient; keep Fault Tolerance from opening the circuit across cases.
%test.com.commercehub.order.infrastructure.client.ProductClient/getById/CircuitBreaker/enabled=false
%test.com.commercehub.order.infrastructure.client.ProductClient/getById/Retry/enabled=false
%test.com.commercehub.order.infrastructure.client.ProductClient/getById/Timeout/enabled=false

quarkus.smallrye-openapi.info-title=CommerceHub Order Service API
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
quarkus.smallrye-openapi.info-description=Orders of the CommerceHub platform. Errors follow RFC 9457 (application/problem+json). Monetary values use scale 4. The authenticated JWT subject is the customer id.
quarkus.smallrye-openapi.info-license-name=Portfolio project
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=bearer
quarkus.smallrye-openapi.security-scheme-description=JWT issued by the User Service (demonstration only).
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.title=CommerceHub Order Service

quarkus.log.console.json.enabled=true
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false

# --- JWT (Sprint 5) -----------------------------------------------------------
mp.jwt.verify.publickey.location=jwt/publicKey.pem
mp.jwt.verify.issuer=${JWT_ISSUER:https://commercehub.example/issuer}
quarkus.native.resources.includes=jwt/*.pem
quarkus.http.auth.permission.public.paths=/q/*
quarkus.http.auth.permission.public.policy=permit
%test.quarkus.http.auth.permission.otel-probe.paths=/__otel/*
%test.quarkus.http.auth.permission.otel-probe.policy=permit

# --- Observability (Sprint 6) -------------------------------------------------
# OTLP gRPC to Jaeger v2 (native receiver on 4317). Metrics stay on Prometheus scrape of /q/metrics.
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.exporter.otlp.protocol=${OTEL_EXPORTER_OTLP_PROTOCOL:grpc}
quarkus.otel.metrics.exporter=none
quarkus.otel.logs.exporter=none
%test.quarkus.otel.sdk.disabled=true

# --- Kafka / messaging (Sprint 4) -------------------------------------------------
# In-cluster services reach the broker at kafka:9092; host-side quarkus:dev uses localhost:29092.
# Tests leave this unset so Kafka Dev Services can inject the container address when enabled.
%dev,prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

# Inbound: inventory events drive the order saga. Failures after retries go to the DLQ.
mp.messaging.incoming.inventory-events.connector=smallrye-kafka
mp.messaging.incoming.inventory-events.topic=commerce.inventory.events
mp.messaging.incoming.inventory-events.group.id=order-service
mp.messaging.incoming.inventory-events.auto.offset.reset=earliest
mp.messaging.incoming.inventory-events.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.inventory-events.failure-strategy=dead-letter-queue
mp.messaging.incoming.inventory-events.dead-letter-queue.topic=commerce.inventory.events.dlq

# Outbox relay publishes PENDING rows on a schedule (see OutboxRelay).
commercehub.outbox.relay.enabled=true
commercehub.outbox.relay.every=1s

# Tests run without a broker: use the in-memory connector and keep the relay idle.
%test.mp.messaging.incoming.inventory-events.connector=smallrye-in-memory
%test.commercehub.outbox.relay.enabled=false
%test.commercehub.outbox.metrics.enabled=false
%test.quarkus.kafka.devservices.enabled=false
