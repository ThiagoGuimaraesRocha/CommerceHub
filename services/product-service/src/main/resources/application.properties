quarkus.application.name=product-service
quarkus.application.version=0.2.0

quarkus.http.port=8080
%dev.quarkus.http.port=8082
quarkus.http.test-port=0

# Local infrastructure is started explicitly through the root docker-compose.yml.
# Tests start a throwaway Oracle container through Dev Services instead.
quarkus.devservices.enabled=false
%test.quarkus.devservices.enabled=true

quarkus.datasource.db-kind=oracle
quarkus.datasource.devservices.enabled=false
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=gvenzl/oracle-free:23.26.3-slim-faststart@sha256:f5ff19033860d662c821cb04eb10483fa94f14f78eae252d054291ea07028093
%dev,prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
%dev,prod.quarkus.datasource.username=${PRODUCT_DB_USERNAME:product_schema}
%dev,prod.quarkus.datasource.password=${PRODUCT_DB_PASSWORD}
quarkus.datasource.jdbc.max-size=10

# Schema is owned by Flyway; Hibernate never changes it.
quarkus.flyway.migrate-at-start=${FLYWAY_MIGRATE_AT_START:true}
quarkus.flyway.locations=db/migration
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.jdbc.timezone=UTC
quarkus.hibernate-orm.mapping.timezone.default-storage=native
quarkus.hibernate-orm.jdbc.statement-fetch-size=100
%dev.quarkus.hibernate-orm.log.sql=false

quarkus.smallrye-openapi.info-title=CommerceHub Product Service API
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
quarkus.smallrye-openapi.info-description=Product catalog of the CommerceHub platform. Errors follow RFC 9457 (application/problem+json). Monetary values use scale 4.
quarkus.smallrye-openapi.info-license-name=Portfolio project
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.title=CommerceHub Product Service

quarkus.log.console.json.enabled=true
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false
