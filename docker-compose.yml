name: commercehub

# Infrastructure starts by default. Application containers are opt-in:
#   docker compose up -d                       -> Oracle + Kafka + Jaeger + Prometheus + Grafana
#   docker compose --profile apps up -d --build -> plus the four services

x-service: &service
  profiles: ["apps"]
  restart: unless-stopped
  depends_on:
    oracle:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:8080/q/health/ready || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s

x-db-url: &db-url jdbc:oracle:thin:@//oracle:1521/FREEPDB1

# In-cluster bootstrap address shared by the event-driven services (Sprint 4).
x-kafka-bootstrap: &kafka-bootstrap kafka:9092

# Jaeger v2 native OTLP gRPC (Sprint 6). Host-side quarkus:dev uses localhost:4317.
x-otel-endpoint: &otel-endpoint http://jaeger:4317

services:
  oracle:
    image: gvenzl/oracle-free:23.26.3-slim-faststart@sha256:f5ff19033860d662c821cb04eb10483fa94f14f78eae252d054291ea07028093
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?set ORACLE_PASSWORD in .env}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?set USER_DB_PASSWORD in .env}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD:?set PRODUCT_DB_PASSWORD in .env}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?set ORDER_DB_PASSWORD in .env}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?set INVENTORY_DB_PASSWORD in .env}
    ports:
      - "${ORACLE_HOST_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./infra/oracle/init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Single-node Kafka in KRaft mode (no ZooKeeper). Always on, like Oracle, so that
  # `quarkus:dev` and the application profile both have a broker available (Sprint 4).
  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092,OPENSHIFT://0.0.0.0:39092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092,OPENSHIFT://${KAFKA_OPENSHIFT_ADVERTISED_HOST:-127.0.0.1}:39092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,OPENSHIFT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    ports:
      - "${KAFKA_HOST_PORT:-29092}:29092"
      - "${KAFKA_OPENSHIFT_HOST_PORT:-39092}:39092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  # Jaeger v2 all-in-one: OTLP on 4317/4318, UI on 16686. No separate collector (ADR 0011).
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.21.0
    restart: unless-stopped
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    mem_limit: 512m

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 384m

  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger
    mem_limit: 256m

  user-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: user-service
        VERSION: 0.8.0
    image: ghcr.io/${GHCR_OWNER:-local}/commercehub-user-service:0.8.0
    environment:
      DB_URL: *db-url
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      JWT_ISSUER: ${JWT_ISSUER:-https://commercehub.example/issuer}
      JWT_LIFESPAN_SECONDS: ${JWT_LIFESPAN_SECONDS:-3600}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_ADMIN_FULL_NAME: ${DEMO_ADMIN_FULL_NAME:-CommerceHub Admin}
      OTEL_EXPORTER_OTLP_ENDPOINT: *otel-endpoint
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    ports:
      - "8081:8080"

  product-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: product-service
        VERSION: 0.8.0
    image: ghcr.io/${GHCR_OWNER:-local}/commercehub-product-service:0.8.0
    environment:
      DB_URL: *db-url
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD}
      JWT_ISSUER: ${JWT_ISSUER:-https://commercehub.example/issuer}
      OTEL_EXPORTER_OTLP_ENDPOINT: *otel-endpoint
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    ports:
      - "8082:8080"

  order-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: order-service
        VERSION: 0.8.0
    image: ghcr.io/${GHCR_OWNER:-local}/commercehub-order-service:0.8.0
    environment:
      DB_URL: *db-url
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD}
      PRODUCT_SERVICE_URL: http://product-service:8080
      KAFKA_BOOTSTRAP_SERVERS: *kafka-bootstrap
      JWT_ISSUER: ${JWT_ISSUER:-https://commercehub.example/issuer}
      OTEL_EXPORTER_OTLP_ENDPOINT: *otel-endpoint
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    ports:
      - "8083:8080"
    depends_on:
      oracle:
        condition: service_healthy
      kafka:
        condition: service_healthy
      product-service:
        condition: service_healthy

  inventory-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: inventory-service
        VERSION: 0.8.0
    image: ghcr.io/${GHCR_OWNER:-local}/commercehub-inventory-service:0.8.0
    environment:
      DB_URL: *db-url
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: *kafka-bootstrap
      JWT_ISSUER: ${JWT_ISSUER:-https://commercehub.example/issuer}
      OTEL_EXPORTER_OTLP_ENDPOINT: *otel-endpoint
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    ports:
      - "8084:8080"
    depends_on:
      oracle:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  oracle-data:
  prometheus-data:
  grafana-data:
