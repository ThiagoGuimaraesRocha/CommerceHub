name: commercehub

# Infrastructure starts by default. Application containers are opt-in:
#   docker compose up -d                       -> Oracle only (for quarkus:dev)
#   docker compose --profile apps up -d --build -> Oracle + the four services

x-service: &service
  profiles: ["apps"]
  restart: unless-stopped
  depends_on:
    oracle:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:8080/q/health/ready || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s

x-db-url: &db-url jdbc:oracle:thin:@//oracle:1521/FREEPDB1

# In-cluster bootstrap address shared by the event-driven services (Sprint 4).
x-kafka-bootstrap: &kafka-bootstrap kafka:9092

services:
  oracle:
    image: gvenzl/oracle-free:23.26.3-slim-faststart@sha256:f5ff19033860d662c821cb04eb10483fa94f14f78eae252d054291ea07028093
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?set ORACLE_PASSWORD in .env}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?set USER_DB_PASSWORD in .env}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD:?set PRODUCT_DB_PASSWORD in .env}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?set ORDER_DB_PASSWORD in .env}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?set INVENTORY_DB_PASSWORD in .env}
    ports:
      - "${ORACLE_HOST_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./infra/oracle/init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Single-node Kafka in KRaft mode (no ZooKeeper). Always on, like Oracle, so that
  # `quarkus:dev` and the application profile both have a broker available (Sprint 4).
  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "${KAFKA_HOST_PORT:-29092}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  user-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: user-service
    image: ghcr.io/${GHCR_OWNER:-local}/commercehub-user-service:0.1.0
    environment:
      DB_URL: *db-url
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
    ports:
      - "8081:8080"

  product-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: product-service
        VERSION: 0.2.0
    image: ghcr.io/${GHCR_OWNER:-local}/commercehub-product-service:0.2.0
    environment:
      DB_URL: *db-url
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD}
    ports:
      - "8082:8080"

  order-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: order-service
        VERSION: 0.4.0
    image: ghcr.io/${GHCR_OWNER:-local}/commercehub-order-service:0.4.0
    environment:
      DB_URL: *db-url
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD}
      PRODUCT_SERVICE_URL: http://product-service:8080
      KAFKA_BOOTSTRAP_SERVERS: *kafka-bootstrap
    ports:
      - "8083:8080"
    depends_on:
      oracle:
        condition: service_healthy
      kafka:
        condition: service_healthy
      product-service:
        condition: service_healthy

  inventory-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: inventory-service
        VERSION: 0.4.0
    image: ghcr.io/${GHCR_OWNER:-local}/commercehub-inventory-service:0.4.0
    environment:
      DB_URL: *db-url
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: *kafka-bootstrap
    ports:
      - "8084:8080"
    depends_on:
      oracle:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  oracle-data:
  kafka-data:
