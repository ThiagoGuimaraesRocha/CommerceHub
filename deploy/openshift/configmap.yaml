apiVersion: v1
kind: ConfigMap
metadata:
  name: commercehub-config
  namespace: commercehub
  labels:
    app.kubernetes.io/part-of: commercehub
data:
  JWT_ISSUER: https://commercehub.example/issuer
  JWT_LIFESPAN_SECONDS: "3600"
  PRODUCT_SERVICE_URL: http://product-service:8080
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  FLYWAY_MIGRATE_AT_START: "false"
