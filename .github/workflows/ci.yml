name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_VERSION: "0.8.0"

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Integration tests start Oracle Database Free through Quarkus Dev Services (Testcontainers).
      - name: Pre-pull Oracle test image
        run: docker pull gvenzl/oracle-free:23.26.3-slim-faststart@sha256:f5ff19033860d662c821cb04eb10483fa94f14f78eae252d054291ea07028093

      - name: Validate OpenShift manifests
        run: ./scripts/validate-manifests.sh

      - name: Build, unit, API and integration tests
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            services/*/target/surefire-reports/
            services/*/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish images to GHCR
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      actions: write
    strategy:
      fail-fast: true
      matrix:
        service:
          - user-service
          - product-service
          - order-service
          - inventory-service

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set image names
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/commercehub-${{ matrix.service }}"
          sha_tag="sha-$(echo '${{ github.sha }}' | cut -c1-7)"
          tags="${image}:${IMAGE_VERSION},${image}:${sha_tag}"
          if [[ '${{ github.ref }}' == refs/tags/* ]]; then
            git_tag="${GITHUB_REF_NAME}"
            tags="${tags},${image}:${git_tag}"
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${tags}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/service.Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ env.IMAGE_VERSION }}
            VCS_REF=${{ github.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          labels: |
            org.opencontainers.image.title=commercehub-${{ matrix.service }}
            org.opencontainers.image.description=CommerceHub ${{ matrix.service }}
            org.opencontainers.image.version=${{ env.IMAGE_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
